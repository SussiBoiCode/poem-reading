<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시 낭송 수정본</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181b23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시 낭송">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: one worksheet sheet on a cool desk; sticky toolbar; poem on ruled lines, commentary as prose */
:root{
  --desk:#eef0f4; --sheet:#ffffff; --ink:#1c2130; --muted:#6a7081; --rule:#e2e6ee;
  --new:#c42e28; --new-bg:#fcebea; --new-line:#e9a19d;
  --old:#7d838f; --old-bg:#f1f2f5; --old-line:#b9bec8;
  --add:#1f7a44; --add-bg:#e6f4ea; --add-line:#8fcca5;
  --serif:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#101218; --sheet:#181b23; --ink:#e7e9ef; --muted:#9aa0ae; --rule:#272b36;
  --new:#ff7a72; --new-bg:#3a1c1c; --new-line:#8a3a36;
  --old:#8e94a0; --old-bg:#22252e; --old-line:#4a4f5c;
  --add:#5fd08a; --add-bg:#16301f; --add-line:#2f6b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101218; --sheet:#181b23; --ink:#e7e9ef; --muted:#9aa0ae; --rule:#272b36;
  --new:#ff7a72; --new-bg:#3a1c1c; --new-line:#8a3a36;
  --old:#8e94a0; --old-bg:#22252e; --old-line:#4a4f5c;
  --add:#5fd08a; --add-bg:#16301f; --add-line:#2f6b45; color-scheme:dark}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.bar-in,.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{font:500 14px var(--sans);padding:7px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg button:focus-visible,.chg:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{font-weight:600;color:var(--new)}
.count i{font-style:normal;font-weight:600;color:var(--old)}
.wrap{padding-block:28px 56px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:clamp(20px,5vw,48px)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.legend span{display:inline-flex;align-items:center;gap:6px}
section{margin-top:40px}
.stage{font:600 13px var(--sans);letter-spacing:.06em;color:var(--muted)}
h2{font:700 clamp(22px,4vw,28px)/1.3 var(--serif);margin:4px 0 6px;text-wrap:balance}
.prompt{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:62ch}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tag{font-size:12px;padding:2px 10px;border:1px solid var(--rule);border-radius:999px;color:var(--muted)}
.poem{font-family:var(--serif);font-size:clamp(17px,2.6vw,19px);line-height:2.3;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(2.3em - 1px),var(--rule) calc(2.3em - 1px) 2.3em);
  padding-left:4px}
.poem p{margin:0}
.poem .gap{height:2.3em}
.pause{color:var(--muted);padding:0 .15em}
.prose p{margin:0 0 1.2em;max-width:66ch;word-break:keep-all}
.chg{cursor:pointer;border-radius:5px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  color:var(--new);background:var(--new-bg);border:1px solid var(--new-line);transition:color .15s,background-color .15s,border-color .15s}
.chg.is-old{color:var(--old);background:var(--old-bg);border:1px dashed var(--old-line)}
.chg.add:not(.is-old){color:var(--add);background:var(--add-bg);border-color:var(--add-line)}
.chg.empty{font:500 11px var(--sans);padding:1px 6px;vertical-align:.15em;letter-spacing:.02em}
.chg:hover{filter:brightness(.97)}
.sw{display:inline-block;width:22px;height:14px;border-radius:4px}
.sw.n{background:var(--new-bg);border:1px solid var(--new-line)}
.sw.o{background:var(--old-bg);border:1px dashed var(--old-line)}
.sw.a{background:var(--add-bg);border:1px solid var(--add-line)}
.note{font-size:13px;color:var(--muted);margin-top:28px}
@media (prefers-reduced-motion:reduce){.chg{transition:none}}
</style>

<div class="bar"><div class="bar-in">
  <div class="seg" role="group" aria-label="전체 전환">
    <button id="btn-old" type="button" aria-pressed="false">All previous ver</button>
    <button id="btn-new" type="button" aria-pressed="true">All new ver</button>
  </div>
  <span class="count" id="count"></span>
</div></div>

<main class="wrap"><div class="sheet">
  <div class="meta"><span>학번 20310</span><span>시 낭송 · 10월 27일</span></div>
  <div class="legend">
    <span><i class="sw n"></i>바뀐 부분</span>
    <span><i class="sw a"></i>새로 추가</span>
    <span><i class="sw o"></i>이전 버전</span>
    <span>박스를 누르면 하나씩 바뀝니다</span>
  </div>

  <section>
    <div class="stage">1-1단계</div>
    <h2>시 창작</h2>
    <p class="prompt">사진과 그에 어울리는 시를 창작해 보세요.</p>
    <div class="tags"><span class="tag">글감 · 사랑</span><span class="tag">16행 내외</span></div>
    <div class="poem" id="poem"></div>
  </section>

  <section>
    <div class="stage">1-2단계</div>
    <h2>시 해설</h2>
    <p class="prompt">창작 의도, 핵심 주제, 시어의 함축적 의미를 논리적으로 깊이 있게 해설하고 설득력 있게 전달하는 글을 써 보세요.</p>
    <div class="prose" id="prose"></div>
  </section>

  <p class="note">'/' 표시는 원본 종이에 적힌 낭송 쉼표입니다.</p>
</div></main>

<script>
const C=(o,n)=>({o,n});
const POEM=[
  ["사람은 원래 그렇다고 한다."],
  null,
  ["소중한 것들은"],["다 익숙해지기 때문에"],["소를 잃고 나서야"],["그 외양간이 왜 있었는지를 / 깨닫게 된다고."],
  null,
  ["내가 시간을 / 되돌릴 수 있었다면"],["으로 항상 시작하는 상상을 해봐야 / 뭐가 바뀌냐."],
  null,
  ["그렇지만,"],
  null,
  ["민들레씨는 그 묵직한 바람을 맞아야"],["비로소 끝없이 더 넓은 공간으로 날아간다고"],["그 무시무시한 태풍은 / 열에너지의 불균형을 해소해준다고."],
  null,
  ["어쩌면 특히 더 넓던 그 하늘이"],["나를 특히 더 바라봐줘서"],["이런 일이 일어난 거라고."],
  null,
  ["언젠가 내가 다시 ",C("널 만나러 갈","거기로 돌아갈")," 거라고."],
  [C("기다려줘.","나중에 보자.")]
];
const PROSE=[
  ["인터넷에서 명언을 검색해보면 흔히 있는 말입니다. 인간은 익숙함에 의해 얼마나 소중한지를 놓치니, 있을 때 잘하라고. 저는 미국에서 살고 있을 땐, ",
   C("낯설게 생긴 친구들, 환경 등","낯선 환경과 친구들에게 적응하느라"),
   " 고생을 꽤 해서 한국에서 사는 것이 나에게 더 맞지 않을까 싶었습니다.",
   C(""," 지금 생각하면 다 좋은 친구들이었는데, 그때는 그걸 잘 몰랐습니다."),
   " 그런 저의 선택에 막상 돌아와 보니",
   C(" 완전히 틀렸었다는 걸",", 그곳에서의 시간이 생각보다 훨씬 소중했다는 걸"),
   " 깨달았습니다. 한 때는 정말 후회를 많이 했고, 지금도 미련을 완전히 버렸다고 하긴 힘듭니다.",
   C(""," 아마 여러분도 졸업이나 이사처럼, 떠나고 나서야 그때가 좋았다는 걸 알게 된 경험이 한 번쯤은 있을 거라고 생각합니다.")],
  ["민들레씨, 태풍 이야기는 결국 고통을 겪고 극복해야 더 성장할 수 있다는 이야기입니다. 특히, “끝없이 넓은 공간”과 “태풍”, 모두 제가 미국에서 살던 곳이랑 연관된 것들입니다. ",
   C("(태풍 자주 왔었던)","그곳은 고개만 들면 끝없이 넓은 하늘이 펼쳐지고, 태풍도 자주 찾아오던 곳이었습니다."),
   " 어쩌면 특히 ~ 부분은 그러니, 이것도 하늘이 나의 성장을 위해서 준 시련이 아닐까라고 고통에서 극복하고 성장하는 모습을 의미합니다. 미국에 계속 있었으면 계속 한국이 더 나을 거라고 생각했을 거란 걸 깨닫고, 물론 이제 깨달음을 얻었겠다, 제가 미국으로 돌아가고 싶으니, 언젠가 ~ 부분을 넣었습니다. 사진은 제가 미국에서 중1 때 다녔던 학교를 한국으로 돌아오기 ",
   C("하루 전에 마지막으로","얼마 전에")," 찍은 사진입니다."]
];

const chips=[];
function textNode(s,poem){
  if(!poem||s.indexOf(" / ")<0) return document.createTextNode(s);
  const f=document.createDocumentFragment();
  s.split(" / ").forEach((part,i)=>{
    if(i){const p=document.createElement("span");p.className="pause";p.textContent=" / ";f.appendChild(p);}
    f.appendChild(document.createTextNode(part));
  });
  return f;
}
function build(parts,poem){
  const f=document.createDocumentFragment();
  parts.forEach(x=>{
    if(typeof x==="string"){f.appendChild(textNode(x,poem));return;}
    const lead=document.createElement("span"), box=document.createElement("span"), trail=document.createElement("span");
    box.className=x.o.trim()?"chg":"chg add"; box.tabIndex=0; box.setAttribute("role","button");
    const c={x,lead,box,trail,old:false};
    box.addEventListener("click",()=>set(c,!c.old));
    box.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set(c,!c.old);}});
    chips.push(c);
    f.append(lead,box,trail);
  });
  return f;
}
function paint(c){
  const s=c.old?c.x.o:c.x.n, m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);
  c.lead.textContent=m[1]; c.trail.textContent=m[3];
  const empty=!m[2];
  c.box.classList.toggle("is-old",c.old);
  c.box.classList.toggle("empty",empty);
  c.box.textContent=empty?(c.old?"없음":"삭제됨"):m[2];
  c.box.setAttribute("aria-label",(c.old?"이전 버전: ":"새 버전: ")+(empty?(c.old?"없음":"삭제됨"):m[2])+". 눌러서 전환");
}
function set(c,old){c.old=old;paint(c);sync();}
function sync(){
  const o=chips.filter(c=>c.old).length, n=chips.length-o;
  document.getElementById("count").innerHTML="수정 "+chips.length+"곳 · 새 <b>"+n+"</b> · 이전 <i>"+o+"</i>";
  document.getElementById("btn-old").setAttribute("aria-pressed",o===chips.length);
  document.getElementById("btn-new").setAttribute("aria-pressed",n===chips.length);
}
const poemEl=document.getElementById("poem");
POEM.forEach(line=>{
  if(!line){const g=document.createElement("div");g.className="gap";poemEl.appendChild(g);return;}
  const p=document.createElement("p");p.appendChild(build(line,true));poemEl.appendChild(p);
});
const proseEl=document.getElementById("prose");
PROSE.forEach(par=>{const p=document.createElement("p");p.appendChild(build(par,false));proseEl.appendChild(p);});
chips.forEach(paint); sync();
document.getElementById("btn-old").addEventListener("click",()=>{chips.forEach(c=>{c.old=true;paint(c);});sync();});
document.getElementById("btn-new").addEventListener("click",()=>{chips.forEach(c=>{c.old=false;paint(c);});sync();});
</script>
<script>
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
